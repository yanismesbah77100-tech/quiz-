name: Générer les vidéos quiz

on:
  push:
    branches: [main]
    paths: [queue.json, generate.py]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: videos
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Installer les outils
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q ffmpeg fonts-dejavu-core
          pip install edge-tts gTTS pillow numpy

      - name: Générer les vidéos de la file
        run: |
          
          
          python3 generate.py --queue queue.json --out videos

      - name: Enregistrer les vidéos
        run: |
          git config user.name "quiz-bot"
          git config user.email "quiz-bot@users.noreply.github.com"
          git add videos
          git diff --cached --quiet && exit 0
          git commit -m "Nouvelles vidéos quiz"
          git pull --rebase
          git push
